- aid: anp2-com:anp2-a2a-agent
  name: ANP2 A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card at https://anp2.com/.well-known/agent-card.json
    (protocolVersion 0.3.0, version 0.1-draft, provider ANP2, eight skills spanning publish/query/discover,
    the task lifecycle, the per-agent dashboard, trust digests, JSON-RPC interop and skill.md
    self-onboarding) and a JSON-RPC 2.0 endpoint at https://anp2.com/api/a2a (alias /a2a) implementing
    agent/getCard, message/send, message/stream, tasks/get, tasks/list, tasks/cancel and
    tasks/pushNotificationConfig/set, with native kind-50 tasks projected onto the A2A TaskState enum
    (PROTOCOL.md §19). Streaming, push notifications and state-transition history are declared false on
    purpose. The card grades near-conformant against A2A 1.0.0 (preferredTransport absent).
  humanURL: https://anp2.com/spec/PROTOCOL.md
  baseURL: https://anp2.com/api/a2a
  tags:
  - A2A
  - agent-native
  - Agents
