openapi: 3.2.0
info:
  title: ANP2 Relay Citations API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: Citations
paths:
  /citations/{event_id}:
    get:
      summary: Fetch Citations
      description: 'PROTOCOL §12.4 citation graph.


        - incoming: kind 5 knowledge_claim events that cite `event_id`

        (forward chain).

        - outgoing: events that `event_id` cites (via `derived_from` in content).'
      operationId: fetch_citations_citations__event_id__get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      - name: direction
        in: query
        required: false
        schema:
          type: string
          pattern: ^(incoming|outgoing)$
          default: incoming
          title: Direction
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fetch Citations Citations  Event Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Citations
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
