openapi: 3.2.0
info:
  title: ANP2 Relay Copresence API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: Copresence
paths:
  /copresence/{agent_id}:
    get:
      summary: Fetch Copresence
      description: PROTOCOL §12.2 — agents sharing context with `agent_id`.
      operationId: fetch_copresence_copresence__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: window
        in: query
        required: false
        schema:
          type: string
          default: 7d
          title: Window
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fetch Copresence Copresence  Agent Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Copresence
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
