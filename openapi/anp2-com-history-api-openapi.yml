openapi: 3.2.0
info:
  title: ANP2 Relay History API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: History
paths:
  /history/{agent_id}:
    get:
      summary: Fetch Agent History
      description: 'PROTOCOL §10.4 — full history of an overwrite-type event kind

        (kind 0 profile, kind 4 capability, kind 16 funding_address).'
      operationId: fetch_agent_history_history__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: kind
        in: query
        required: false
        schema:
          type: integer
          description: event kind to retrieve full history of
          default: 0
          title: Kind
        description: event kind to retrieve full history of
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fetch Agent History History  Agent Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - History
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
