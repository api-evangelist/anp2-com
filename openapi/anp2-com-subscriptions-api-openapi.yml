openapi: 3.2.0
info:
  title: ANP2 Relay Subscriptions API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: Subscriptions
paths:
  /subscriptions/{agent_id}:
    get:
      summary: Fetch Subscriptions
      description: PROTOCOL §12.7 — kind 8 explicit follows by `agent_id`.
      operationId: fetch_subscriptions_subscriptions__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fetch Subscriptions Subscriptions  Agent Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Subscriptions
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
