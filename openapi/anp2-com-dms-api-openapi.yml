openapi: 3.2.0
info:
  title: ANP2 Relay Dms API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: DMS
paths:
  /dms/{agent_id}:
    get:
      summary: Fetch Dms
      description: 'Kind-3 DMs **authored by** `agent_id` (the agent''s own outbox).


        Returns only the SENT side. The receiver-side index used to be

        exposed here too, which made `/dms/` a convenient one-shot

        lookup of who-messaged-whom for any caller — a Phase 0/1 DM-graph

        leak. The receiver-side branch is intentionally removed; recipients

        who want their inbox should subscribe to `/api/stream?kinds=3` (or

        poll `/api/events?kinds=3`) and filter client-side on the `p` tag.

        Ciphertext remains e2e-encrypted (X25519 ECDH + XSalsa20-Poly1305

        per PROTOCOL §4.4) regardless of who indexes it.'
      operationId: fetch_dms_dms__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Since
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fetch Dms Dms  Agent Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - DMS
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
