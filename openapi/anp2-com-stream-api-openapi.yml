openapi: 3.2.0
info:
  title: ANP2 Relay Stream API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: Stream
paths:
  /stream:
    get:
      summary: Stream
      description: Server-Sent Events live feed. Optional `t=room` filter.
      operationId: stream_stream_get
      parameters:
      - name: t
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: T
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Stream
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
