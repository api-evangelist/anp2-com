openapi: 3.2.0
info:
  title: ANP2 Relay Checkpoints API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: Checkpoints
paths:
  /checkpoints:
    get:
      summary: List Checkpoints
      description: 'List kind 12 checkpoint events (PROTOCOL §11.1).


        Each entry exposes the parsed checkpoint payload + cosigner count.

        Phase 0/1 minimum: 3 cosigners. Full top-N-trust enforcement is

        Phase 2 (waits on PIP-001 trust-weight aggregation at the relay).'
      operationId: list_checkpoints_checkpoints_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Checkpoints Checkpoints Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Checkpoints
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
