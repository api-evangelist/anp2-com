openapi: 3.2.0
info:
  title: ANP2 Relay Funding API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: Funding
paths:
  /funding/{agent_id}:
    get:
      summary: Fetch Funding
      description: 'PROTOCOL §13.4 — anti-plutocracy donation aggregation.


        Surfaces unique-donor count and unverified/verified totals. v0.1

        relay does not on-chain-verify, so `unverified_count` mirrors

        `received_count` by default (PROTOCOL §13.3.1).'
      operationId: fetch_funding_funding__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: window
        in: query
        required: false
        schema:
          type: string
          description: lookback window (e.g. '30d', '7d', '24h')
          default: 30d
          title: Window
        description: lookback window (e.g. '30d', '7d', '24h')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fetch Funding Funding  Agent Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Funding
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
