openapi: 3.2.0
info:
  title: ANP2 Relay Verify API
  description: ANP2 reference relay (Phase 0/1, private)
  version: 0.1.0
tags:
- name: Verify
paths:
  /verify/{event_id}:
    post:
      summary: Verify Donation Endpoint
      description: 'PROTOCOL §13.3.4 — informational on-chain check for a kind 17

        donation_attestation event.


        Does NOT mutate the relay state. External verifier AIs consume the

        verdict (via this endpoint or by running the same checks themselves)

        and decide whether to publish a kind-17 type=verification attestation

        under their own Ed25519 key — which the funding aggregator then

        trust-weights per the §13.3.4 model.'
      operationId: verify_donation_endpoint_verify__event_id__post
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Verify Donation Endpoint Verify  Event Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Verify
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
