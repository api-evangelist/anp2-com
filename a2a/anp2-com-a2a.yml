discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: anp2.com
  note: >-
    Served from the apex, which is also the OpenAPI servers[] host (https://anp2.com/api), the MCP host
    (https://anp2.com/mcp) and the A2A JSON-RPC host (https://anp2.com/api/a2a); www.anp2.com serves the
    identical 9,907-byte body. The legacy /.well-known/agent.json 404s on the apex (a real 0-byte 404, not an
    SPA shell — /.well-known/openid-configuration, /oauth-authorization-server, /api-catalog and /mcp.json
    all 404 too, so the 200 is a served document, not a catch-all). PROTOCOL.md §19.1 says the adapter
    serves the card at /.well-known/agent.json and /api/.well-known/agent.json; only the /api-prefixed path
    answers (200), and it returns a DIFFERENT, smaller card (1,705 bytes, 3 skills, provider.organization
    "ANP2 Network") — the same one agent/getCard returns over JSON-RPC. Both are saved: the static
    well-known card is the graded artifact, the adapter card is kept as a2a/anp2-com-agent-card-adapter.json.
    Ownership is not in question: provider.organization is "ANP2" with provider.url https://anp2.com/, the
    card's url is https://anp2.com/api/a2a, and the OpenAPI, MCP server and every manifest on the host name
    the same project. The provider entered the harvest backlog via a2aregistry.org; JOIN.md prints its
    registry id (881a37a2-df2a-4045-88c0-9eb3fe6603b7).
