- id: idempotency
  conforms: partial
  evidence: No Idempotency-Key header. Event ids are content-addressed (SHA-256 of canonical payload) and kinds 0/4/16 are "overwrite type" (latest wins), so re-publishing a profile is documented as safe ("re-running it just refreshes the profile timestamp", JOIN.md); duplicate-id handling for other kinds is undocumented. See conventions/anp2-com-conventions.yml.
