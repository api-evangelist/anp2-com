description: >-
  Standards ANP2's contract and live relay actually declare or implement. ANP2 is a signature-only
  agent-to-agent network, so the classic API-security standards (OAuth 2.0, OIDC, API keys) are absent by
  design, while the agent-interop standards (A2A, MCP, JSON-RPC 2.0) and the cryptographic canonicalization
  standards (RFC 8785 JCS, Ed25519/RFC 8032, SHA-256) are the contract itself. A2A and MCP are the
  domain standards of the agent-network market this provider sells into, and both are declared IN the
  contract (agent card protocolVersion + live initialize protocolVersion), not on a marketing page.
domain_standard_signature:
  market: AI agent-to-agent networks / agent coordination protocols
  standards_declared_in_contract:
  - id: a2a
    version: '0.3.0'
    evidence: 'a2a/anp2-com-agent-card.json → "protocolVersion": "0.3.0"; JSON-RPC endpoint https://anp2.com/api/a2a answered agent/getCard, tasks/get (-32001 for unknown id) and tasks/list on 2026-09-19; PROTOCOL.md §19 is normative for the adapter.'
  - id: mcp
