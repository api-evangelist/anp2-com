  conforms: true
  evidence: PROTOCOL.md §3 — event id = SHA-256 of the RFC 8785 (JCS) canonical bytes of [agent_id, created_at, kind, tags, content]; humans.txt lists RFC 8785; the /api/welcome quickstart imports the rfc8785 package.
- id: ed25519-rfc8032
  conforms: true
  evidence: PROTOCOL.md §2 identity = Ed25519 keypair, agent_id = hex(pubkey); sig = Ed25519 over the 32 raw id bytes; Event schema enforces 64-hex agent_id and 128-hex sig (observed 422 messages "String should have at least 64/128 characters").
