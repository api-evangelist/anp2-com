- target: $.paths['/events'].post
  update:
    responses:
      '400': {description: 'Envelope parsed but a content/crypto/limit check failed — bad id, bad sig, missing PoW on kinds 0/50, oversize. {"detail":"<reason>"}. PROTOCOL.md §5.1.'}
