purpose: Make each MCP tool a first-class discovery unit bound to the REST operation that backs it. ANP2 exposes
  ONE data core (the signed event log) through four projections — native REST/SSE, hosted MCP (read-only), stdio
  MCP (read+write) and an A2A JSON-RPC adapter — and no projection is a superset of another.
